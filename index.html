<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión Integral de Mantenimiento de Flota — Control preventivo, correctivo y gastos operativos de vehículos y equipos industriales.">
  <meta name="theme-color" content="#0b0f1a">
  <title>Flota Vehicular ECOM — Gestión de Mantenimiento</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/modules.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .boot-loading {
      position: fixed; inset: 0; background: rgba(11,15,26,0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; z-index: 9999;
    }
    .boot-spinner {
      width: 44px; height: 44px; border: 4px solid rgba(59,130,246,.25);
      border-top-color: #3b82f6; border-radius: 50%;
      animation: bootSpin .9s linear infinite;
    }
    @keyframes bootSpin { to { transform: rotate(360deg); } }
    .boot-text { color: #cbd5e1; font-size: 14px; }
  </style>
</head>
<body>

<!-- ================================================
     LOGIN PAGE
     ================================================ -->
<div id="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg class="login-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1M10 8h-1a4 4 0 0 0 0 8h1"/>
          <path d="M14 10v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/>
        </svg>
        <div class="login-brand">
          <h1>Flota Vehicular ECOM</h1>
          <p>Gestión Integral de Mantenimiento</p>
        </div>
      </div>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email" class="form-label">Correo electrónico</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input class="form-control" type="email" id="login-email" name="email" placeholder="usuario@empresa.com" autocomplete="email" required autofocus aria-describedby="email-error">
          <div class="form-error" id="email-error" aria-live="polite"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="login-pwd" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input class="form-control" type="password" id="login-pwd" name="password" placeholder="••••••••" autocomplete="current-password" required aria-describedby="pwd-error">
          <button type="button" class="toggle-password" aria-label="Mostrar/ocultar contraseña" tabindex="-1">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
          <div class="form-error" id="pwd-error" aria-live="polite"></div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="login-submit">
        <span class="btn-text">Iniciar sesión</span>
        <svg class="btn-loader" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></path></svg>
      </button>

      </form>
  </div>
</div>

<!-- ================================================
     MAIN APP WRAPPER
     ================================================ -->
<div id="app-wrapper" style="display:none">

  <!-- SIDEBAR -->
  <aside id="sidebar" role="navigation" aria-label="Menú principal">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg class="sidebar-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1M10 8h-1a4 4 0 0 0 0 8h1"/>
          <path d="M14 10v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/>
        </svg>
        <div class="sidebar-brand">
          <div class="sidebar-title">Flota Vehicular ECOM</div>
          <div class="sidebar-subtitle">Gestión de Mantenimiento</div>
        </div>
      </div>
      <button class="sidebar-toggle" id="btn-collapse-sidebar" aria-label="Colapsar menú" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav" role="list" aria-label="Secciones">
      <!-- Dynamically built by App.buildSidebar() -->
    </nav>

    <div class="sidebar-footer">
      <div class="user-card" id="user-card" onclick="handleLogout()" role="button" tabindex="0" aria-label="Cerrar sesión">
        <div class="user-card-avatar" id="user-card-avatar"></div>
        <div class="user-card-info">
          <div class="user-card-name" id="user-card-name"></div>
          <div class="user-card-role" id="user-card-role"></div>
        </div>
        <svg class="user-card-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div id="main-content">

    <!-- Header -->
    <header id="header" role="banner">
      <button class="header-menu-btn" id="btn-toggle-sidebar-mobile" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="header-title">
        <h1 id="header-title">Dashboard</h1>
        <p id="header-sub">Indicadores en tiempo real</p>
      </div>

      <div class="header-actions">
        <button class="alert-bell" id="btn-alert-bell" aria-label="Centro de alertas" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="alert-badge" id="alert-badge" aria-label="Alertas pendientes" style="display:none">0</span>
        </button>

        <button class="header-user-btn" id="header-user-btn" aria-label="Menú de usuario" aria-haspopup="true" aria-expanded="false">
          <div class="header-user-avatar" id="header-user-avatar"></div>
        </button>
      </div>
    </header>

    <!-- Page content -->
    <main id="page-container" role="main">
      <div class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <h3>Cargando...</h3>
      </div>
    </main>
  </div>

  <!-- ALERTS PANEL -->
  <div id="alerts-panel" role="dialog" aria-modal="true" aria-label="Centro de alertas" hidden>
    <div class="alerts-panel-header">
      <div>
        <div class="fw-700">Centro de Alertas</div>
        <div class="text-sm text-muted">Notificaciones del sistema</div>
      </div>
      <button class="btn btn-outline btn-icon btn-sm" id="close-alert-panel" aria-label="Cerrar panel de alertas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="alerts-panel-body" id="alerts-panel-body">
      <!-- Filled by App.openAlertPanel() -->
    </div>
  </div>

  <!-- User dropdown menu -->
  <div id="user-dropdown" class="dropdown-menu" role="menu" hidden>
    <div class="dropdown-header">
      <div class="dropdown-user-avatar" id="dropdown-user-avatar"></div>
      <div class="dropdown-user-info">
        <div class="dropdown-user-name" id="dropdown-user-name"></div>
        <div class="dropdown-user-role" id="dropdown-user-role"></div>
      </div>
    </div>
    <div class="dropdown-divider"></div>
    <button class="dropdown-item" role="menuitem" onclick="handleLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Cerrar sesión</span>
    </button>
  </div>

</div><!-- /#app-wrapper -->

<!-- Toast container -->
<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<!-- Loading overlay -->
<div id="boot-loading" class="boot-loading" role="status" aria-live="polite">
  <div class="boot-spinner"></div>
  <div class="boot-text">Cargando datos desde Supabase...</div>
</div>

<!-- ================================================
     SCRIPTS
     ================================================ -->
<script src="js/supabase-config.js?v=4"></script>
<script src="js/data.js?v=4"></script>
<script src="js/auth.js?v=4"></script>
<script src="js/alerts.js?v=4"></script>
<script src="js/audit.js?v=4"></script>
<script src="js/assets.js?v=4"></script>
<script src="js/preventive.js?v=4"></script>
<script src="js/corrective.js?v=4"></script>
<script src="js/dashboard.js?v=4"></script>
<script src="js/reports.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
